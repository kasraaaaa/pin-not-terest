<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pin Not Terest</title>
  <meta name="description" content="AI characters, dressed by human creators.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a href="#/" class="logo">Pin <span>Not</span> Terest</a>
      <nav aria-label="Primary" class="nav">
        <a href="#/" class="active">Discover</a>
        <a href="#/">Characters</a>
        <a href="#/">Brands</a>
        <a href="admin.html">For creators</a>
      </nav>
      <div class="search">
        <label for="search" class="sr">Search characters, brands and looks</label>
        <input id="search" type="search" placeholder="Search characters, brands, looks">
      </div>
      <button type="button" id="create-btn" class="btn btn-dark">+ New character</button>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <dialog id="new-dialog" class="dialog" aria-labelledby="new-title">
    <form id="new-char-form" class="stack" method="dialog">
      <h2 id="new-title" style="margin:0 0 4px">New character or brand</h2>
      <label for="nc-kind">Type</label>
      <select id="nc-kind" class="field"><option value="character">Character (model)</option><option value="brand">Brand</option></select>
      <label for="nc-name">Name</label>
      <input id="nc-name" class="field" required maxlength="80" autocomplete="off">
      <label for="nc-bio">One-line bio <span class="muted">(optional)</span></label>
      <input id="nc-bio" class="field" maxlength="300" autocomplete="off">
      <p id="nc-msg" class="muted" role="status"></p>
      <div class="actions" style="justify-content:flex-end">
        <button type="button" id="nc-cancel" class="btn">Cancel</button>
        <button type="submit" class="btn btn-dark">Create</button>
      </div>
    </form>
  </dialog>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>Pin Not Terest — every model here is AI-generated.</span>
      <span>MVP preview</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
