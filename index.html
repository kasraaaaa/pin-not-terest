<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pin Not Terest</title>
  <meta name="description" content="AI characters, dressed by human creators.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202611211455">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a href="#/" class="logo">Pin <span>Not</span> Terest</a>
      <nav aria-label="Primary" class="nav">
        <a href="#/" data-nav="discover" class="active">Discover</a>
        <a href="#/characters" data-nav="characters">Characters</a>
        <a href="#/brands" data-nav="brands">Brands</a>
        <a href="admin.html">For creators</a>
      </nav>
      <div class="search">
        <label for="search" class="sr">Search characters, brands and looks</label>
        <input id="search" type="search" placeholder="Search characters, brands, looks">
      </div>
      <button type="button" id="cart-btn" class="btn cart-btn" aria-label="Shopping cart, 0 items">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        <span id="cart-count" class="cart-count">0</span>
      </button>
      <button type="button" id="create-btn" class="btn btn-dark">+ New character</button>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <dialog id="new-dialog" class="dialog" aria-labelledby="new-title">
    <form id="new-char-form" class="stack" method="dialog">
      <h2 id="new-title" style="margin:0 0 4px">New character or brand</h2>
      <label for="nc-kind">Type</label>
      <select id="nc-kind" class="field"><option value="character">Character (model)</option><option value="brand">Brand</option></select>
      <label for="nc-name">Name</label>
      <input id="nc-name" class="field" required maxlength="80" autocomplete="off">
      <label for="nc-bio">One-line bio <span class="muted">(optional)</span></label>
      <input id="nc-bio" class="field" maxlength="300" autocomplete="off">
      <p id="nc-msg" class="muted" role="status"></p>
      <div class="actions" style="justify-content:flex-end">
        <button type="button" id="nc-cancel" class="btn">Cancel</button>
        <button type="submit" class="btn btn-dark">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="look-dialog" class="look-dialog" aria-labelledby="look-name">
    <div class="look">
      <div class="look-img" id="look-img"></div>
      <div class="look-side">
        <div class="look-head">
          <a id="look-profile" class="look-who" href="#/">
            <span id="look-avatar" class="dot" aria-hidden="true"></span>
            <span><strong id="look-name"></strong><br><span class="muted" id="look-sub"></span></span>
          </a>
          <button type="button" class="icon-btn close-btn" id="look-close" aria-label="Close">&times;</button>
        </div>
        <p class="eyebrow" style="margin:24px 0 8px">In this look</p>
        <div id="look-items" class="look-items"></div>
        <button type="button" id="look-cart" class="btn btn-dark look-cart">View cart</button>
      </div>
    </div>
  </dialog>

  <dialog id="cart-dialog" class="cart-dialog" aria-labelledby="cart-title">
    <div class="cart">
      <div class="look-head">
        <h2 id="cart-title">Your cart</h2>
        <button type="button" class="icon-btn close-btn" id="cart-close" aria-label="Close">&times;</button>
      </div>
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-foot">
        <div class="cart-total"><span>Subtotal</span><strong id="cart-subtotal">$0.00</strong></div>
        <button type="button" id="checkout" class="btn btn-dark" style="width:100%">Checkout</button>
        <p id="checkout-msg" class="muted" role="status" style="text-align:center"></p>
      </div>
    </div>
  </dialog>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>Pin Not Terest — every model here is AI-generated.</span>
      <span>MVP preview</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=202611211455"></script>
  <script src="app.js?v=202611211455"></script>
</body>
</html>
