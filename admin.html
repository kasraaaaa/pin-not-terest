<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator dashboard — Pin Not Terest</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202611211659">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a href="./" class="logo">Pin <span>Not</span> Terest</a>
      <span class="badge">Creator</span>
      <div style="margin-left:auto; display:flex; align-items:center; gap:16px">
        <span id="who" class="muted"></span>
        <button type="button" id="signout" class="btn" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <main class="wrap dash">
    <!-- 1. Creator login -->
    <section id="login" class="panel narrow" hidden>
      <div id="login-mount"></div>
    </section>

    <!-- Switch to creator mode: setup questions for shoppers -->
    <section id="onboard" class="onboard" hidden></section>

    <!-- 2. Creator dashboard -->
    <section id="dash" hidden>
      <div class="dash-grid">
        <aside class="panel">
          <button type="button" id="profile-btn" class="char-btn products-btn" aria-pressed="false">
            <span class="dot" id="profile-dot" aria-hidden="true" style="background:#ddd"></span><span>Your creator profile</span>
          </button>
          <button type="button" id="products-btn" class="char-btn products-btn" aria-pressed="false">
            <span class="dot" aria-hidden="true" style="background:#111"></span><span>Products</span><span class="kind" id="product-count"></span>
          </button>
          <p class="eyebrow" style="margin-top:24px">Your characters &amp; brands</p>
          <ul id="char-list" class="char-list"></ul>
          <details class="new">
            <summary class="btn">+ New character / brand</summary>
            <form id="new-form" class="stack">
              <label for="new-kind">Type</label>
              <select id="new-kind" class="field"><option value="character">Character</option><option value="brand">Brand</option></select>
              <label for="new-name">Name</label>
              <input id="new-name" required maxlength="80" class="field">
              <label for="new-bio">One-line bio</label>
              <input id="new-bio" maxlength="300" class="field">
              <button type="submit" class="btn btn-dark">Create</button>
              <p id="new-msg" class="muted" role="status"></p>
            </form>
          </details>
        </aside>

        <div class="panel" id="detail">
          <p class="muted">Pick a character or brand on the left, or create one.</p>
        </div>
      </div>
    </section>
  </main>

  <dialog id="tag-dialog" class="dialog" aria-labelledby="tag-title">
    <form id="tag-form" method="dialog" class="stack" style="margin-top:0">
      <h2 id="tag-title" style="margin:0">What is the model wearing?</h2>
      <p class="muted" style="margin:0">Tick every item in this picture. Customers will see them next to the picture with an Add to cart button.</p>
      <div id="tag-list" class="tag-list"></div>
      <p id="tag-msg" class="muted" role="status"></p>
      <div class="actions" style="justify-content:flex-end;margin:0">
        <button type="button" id="tag-cancel" class="btn">Cancel</button>
        <button type="submit" class="btn btn-dark">Save</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://upload-widget.cloudinary.com/latest/global/all.js"></script>
  <script src="config.js?v=202611211659"></script>
  <script src="signin.js?v=202611211659"></script>
  <script src="admin.js?v=202611211659"></script>
</body>
</html>
